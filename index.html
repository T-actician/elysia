<style>
:root{
  --a1:#8b6ef2; --a2:#4fa8f5; --a3:#3fe8c9; --a4:#c86dfa;
  --glass:rgba(255,255,255,0.045); --glass-brd:rgba(255,255,255,0.13);
  --txt:#f5f3ff; --txt-dim:#a49fc4; --tt:900ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; max-width:100vw; overflow-x:hidden;}
body{
  font-family:'Manrope',sans-serif; color:var(--txt); overflow:hidden; height:100vh; width:100vw; position:relative;
  background:
    radial-gradient(60% 55% at 14% 6%, #6a4fd6aa, transparent 60%),
    radial-gradient(55% 60% at 92% 8%, #2f6bd688, transparent 60%),
    radial-gradient(70% 65% at 96% 95%, #16c9a755, transparent 60%),
    radial-gradient(50% 50% at 4% 92%, #7c3fc255, transparent 60%),
    linear-gradient(160deg, #050415, #0a0824 45%, #130a34 75%, #050415);
  transition: background var(--tt);
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(1.6px 1.6px at 8% 15%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 22% 45%, #fff, transparent),
    radial-gradient(1.8px 1.8px at 38% 12%, #fff, transparent),
    radial-gradient(1.3px 1.3px at 55% 70%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 70% 30%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 85% 60%, #fff, transparent),
    radial-gradient(1.6px 1.6px at 92% 20%, #fff, transparent),
    radial-gradient(1.1px 1.1px at 15% 80%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 60% 90%, #fff, transparent);
  opacity:.55;
}
#particleCanvas{position:fixed; inset:0; width:100vw; height:100vh; z-index:6; pointer-events:none;}
.app{position:relative; z-index:2; height:100vh; width:100vw; display:grid;
  grid-template-columns:262px 1fr 296px; grid-template-rows:60px 1fr 116px;
  gap:14px; padding:14px; grid-template-areas:"side top top" "side main visual" "nowcard queue queue";}
@media (max-width:1020px){
  .app{grid-template-columns:1fr; grid-template-rows:auto auto auto auto auto; grid-template-areas:"top" "main" "visual" "nowcard" "queue"; overflow-y:visible; height:auto; min-height:100vh;}
  .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:60; transform:translateX(-105%); transition:.3s; width:270px; box-shadow:0 0 60px 10px #000a;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{display:none; position:fixed; inset:0; z-index:55; background:rgba(0,0,0,.5);}
  .sidebar-backdrop.show{display:block;}
  body{overflow-x:hidden;}
}
.glass{background:var(--glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--glass-brd); border-radius:24px;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 24px 70px -24px rgba(0,0,0,.65); transition:border-color var(--tt), box-shadow var(--tt);}

/* SIDEBAR.. */
.sidebar{grid-area:side; padding:24px 18px; display:flex; flex-direction:column; gap:18px; overflow-y:auto;}
.logo-row{display:flex; align-items:flex-start; justify-content:space-between;}
.logo{font-family:'Dancing Script',cursive; font-weight:700; font-size:30px; line-height:1;
  background:linear-gradient(120deg,#fff,#d9cffb 60%,var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.tagline{font-size:11px; color:var(--txt-dim); margin-top:2px;}
.nav{display:flex; flex-direction:column; gap:3px; margin-top:2px;}
.nav-item{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:13px; font-size:13.5px; color:var(--txt-dim); cursor:pointer; transition:.22s;}
.nav-item svg{opacity:.85; flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.05); color:#fff;}
.nav-item.active{background:linear-gradient(120deg, rgba(139,110,242,.32), rgba(79,168,245,.2)); color:#fff; box-shadow:0 0 22px -6px var(--a1);}
.section-label{font-size:10.5px; letter-spacing:1.8px; color:var(--txt-dim); margin:4px 0 -2px 6px; text-transform:uppercase; opacity:.8; display:flex; justify-content:space-between; align-items:center;}
.section-label b{cursor:pointer; color:var(--a3); font-size:14px; font-weight:700;}
.pl-row{display:flex; align-items:center; gap:11px; padding:8px 8px; border-radius:14px; cursor:pointer; transition:.2s;}
.pl-row:hover{background:rgba(255,255,255,.05);}
.pl-dot{width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--a1),var(--a3)); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px;}
.pl-name{font-size:12.5px; font-weight:600;}
.pl-sub{font-size:10.5px; color:var(--txt-dim);}
.empty-hint{font-size:11px; color:var(--txt-dim); padding:6px 8px; font-style:italic;}

/* TOP BAR */
.topbar{grid-area:top; display:flex; align-items:center; gap:14px; padding:0 20px; position:relative;}
.hbtn{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--txt-dim); transition:.2s; flex-shrink:0; position:relative;}
#menuBtn{display:none;}
@media (max-width:1020px){ #menuBtn{display:flex;} }
.hbtn:hover{color:#fff; background:rgba(255,255,255,.06);}

.search{flex:1; max-width:560px; margin:0 auto; display:flex; align-items:center; gap:9px; padding:10px 18px; border-radius:22px; font-size:13px; color:var(--txt-dim);
  background:rgba(255,255,255,.045); border:1px solid var(--glass-brd);}
.search input{background:none; border:none; outline:none; color:var(--txt); font-family:inherit; font-size:13px; flex:1;}
.stat-row{display:flex; justify-content:space-between; font-size:12px; color:var(--txt-dim); padding:5px 0;}
.stat-row b{color:#fff;}
.pbtn{width:100%; padding:9px; margin-top:8px; border-radius:11px; border:1px solid var(--glass-brd); background:rgba(255,255,255,.04); color:#fff; font-size:12px; cursor:pointer; transition:.2s;}
.pbtn:hover{background:rgba(255,255,255,.09);}
.pbtn.danger{color:#ff8a8a; border-color:#ff8a8a44;}

/* MAIN */
.main{grid-area:main; padding:30px 32px; display:flex; flex-direction:column; overflow:hidden;}
#viewContent{flex:1; min-height:0; display:flex; flex-direction:column; overflow-y:auto;}
.np-top{display:flex; gap:36px; flex:1; min-height:0;}
.artwork-wrap{position:relative; width:308px; flex-shrink:0;}
.vinyl{position:absolute; top:14%; left:62%; width:72%; height:72%; border-radius:50%; z-index:1;
  background:radial-gradient(circle at 38% 34%, #3a3550 0%, #17131f 42%, #0a0810 70%); box-shadow:0 0 40px -6px #000a, inset 0 0 0 1px rgba(255,255,255,.06);}
.vinyl::before{content:''; position:absolute; inset:8%; border-radius:50%; background:repeating-radial-gradient(circle, rgba(255,255,255,.05) 0 1.4px, transparent 1.4px 6px);}
.vinyl::after{content:''; position:absolute; inset:41%; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--a2), var(--a1) 60%, #1a1030); box-shadow:0 0 14px -1px var(--a2);}
.vinyl.spin{animation:spin 6s linear infinite;}
@keyframes spin{from{transform:rotate(0)} to{transform:rotate(360deg)}}
.artwork{width:308px; height:308px; border-radius:22px; position:relative; overflow:hidden; z-index:2;
  box-shadow:0 0 0 1px var(--glass-brd), 0 25px 65px -18px #000c, 0 0 60px -14px var(--a1); transition:box-shadow var(--tt); background:#150c33;}
.artwork svg,.artwork img{width:100%; height:100%; display:block; object-fit:cover; position:absolute; inset:0;}
.artwork-glow{position:absolute; inset:-2px; border-radius:24px; pointer-events:none; box-shadow:0 0 44px 4px var(--a2) inset; opacity:.28; animation:breathe 4.2s ease-in-out infinite; z-index:3;}
@keyframes breathe{0%,100%{opacity:.16;} 50%{opacity:.42;}}

/* CRYSTAL SPRING FIELD — decorative glass hearts + gemstone stars around the artwork */
.crystal-field{position:absolute; inset:-78px; z-index:5; pointer-events:none; overflow:visible;}
.crystal-particle{position:absolute; width:28px; height:28px; display:grid; place-items:center; opacity:0; transition:opacity .45s ease; transform:translate3d(0,0,0) scale(.7) rotate(0deg); will-change:transform,opacity; filter:drop-shadow(0 8px 12px rgba(0,0,0,.22));}
.crystal-particle svg{width:100%; height:100%; overflow:visible; display:block;}
.crystal-particle.gem-heart{width:34px; height:34px;}
.crystal-particle.gem-star{width:25px; height:25px;}
.crystal-particle .crystal-shine{mix-blend-mode:screen;}
.crystal-particle .crystal-edge{fill:none; stroke:rgba(255,255,255,.62); stroke-width:1.1; vector-effect:non-scaling-stroke;}
.crystal-particle .crystal-facet{fill:rgba(255,255,255,.20);}
.crystal-particle .crystal-facet-dark{fill:rgba(20,5,30,.22);}
.crystal-particle.playing{opacity:.92;}
.crystal-field::after{content:''; position:absolute; inset:58px; border-radius:50%; background:radial-gradient(circle, rgba(170,120,255,.08), transparent 68%); filter:blur(18px); opacity:0; transition:opacity .7s ease;}
.crystal-field.playing::after{opacity:1;}
@media (max-width:1020px){.crystal-field{inset:-52px;}}
@media (prefers-reduced-motion:reduce){.crystal-field{display:none;}}

<script>
/* ================= TOAST / NOTIFICATIONS ================= */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function notify(title, body){ toast(body ? `${title} — ${body}` : title); }
function showUploadProgress(current,total){
  const box=document.getElementById('uploadProgress'); if(!box) return;
  document.getElementById('uploadProgressTitle').textContent=`Uploading ${current} of ${total}`;
  box.classList.add('show');
}
function hideUploadProgress(){ const box=document.getElementById('uploadProgress'); if(box) box.classList.remove('show'); }

/* ================= IN-APP MODALS (replace native prompt/confirm/alert) ================= */
const modalOverlay=document.getElementById('modalOverlay'), modalBox=document.getElementById('modalBox');
let modalCleanup=null;
function closeModal(){ modalOverlay.classList.remove('show'); modalBox.innerHTML=''; if(modalCleanup){ modalCleanup(); modalCleanup=null; } }
modalOverlay.addEventListener('click', e=>{ if(e.target===modalOverlay) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
function openModal(html){ modalBox.innerHTML=html; modalOverlay.classList.add('show'); const f=modalBox.querySelector('input,textarea'); if(f) setTimeout(()=>f.focus(),30); }

function modalPrompt({title, message='', placeholder='', initial='', multiline=false, confirmLabel='Save'}){
  return new Promise(resolve=>{
    const fieldId='mp_'+Date.now();
    openModal(`
      <div class="modal-title">${title}</div>
      ${message?`<div class="modal-msg">${message}</div>`:''}
      ${multiline
        ? `<textarea class="modal-input" id="${fieldId}" placeholder="${placeholder}">${initial}</textarea>`
        : `<input class="modal-input" id="${fieldId}" placeholder="${placeholder}" value="${initial}">`}
      <div class="modal-actions"><button class="modal-btn" id="mp_cancel">Cancel</button><button class="modal-btn primary" id="mp_ok">${confirmLabel}</button></div>
    `);
    const field=document.getElementById(fieldId);
    const finish=val=>{ closeModal(); resolve(val); };
    document.getElementById('mp_ok').onclick=()=>finish(field.value.trim()||null);
    document.getElementById('mp_cancel').onclick=()=>finish(null);
    if(!multiline) field.addEventListener('keydown', e=>{ if(e.key==='Enter') finish(field.value.trim()||null); });
  });
}
function modalConfirm({title, message='', confirmLabel='Confirm', danger=false}){
  return new Promise(resolve=>{
    openModal(`

/* ================= INDEXEDDB ================= */
function openDB(){
  return new Promise((resolve,reject)=>{
    let req;
    try{ req=indexedDB.open('elysiaDB',1); }catch(e){ reject(e); return; }
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('songs')) db.createObjectStore('songs',{keyPath:'id'});
      if(!db.objectStoreNames.contains('playlists')) db.createObjectStore('playlists',{keyPath:'id'});
      if(!db.objectStoreNames.contains('lyrics')) db.createObjectStore('lyrics',{keyPath:'key'}); // legacy store, unused
      if(!db.objectStoreNames.contains('favorites')) db.createObjectStore('favorites',{keyPath:'songId'});
      if(!db.objectStoreNames.contains('history')) db.createObjectStore('history',{keyPath:'id',autoIncrement:true});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'key'});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
    req.onblocked=()=>reject(new Error('IndexedDB blocked by another open tab'));
  });
}
let dbBroken=false;
// In-memory fallback used only if the browser's real storage can't be opened (private/incognito mode,
// full disk, corrupted profile, storage disabled by policy). Keeps the app usable for this session;
// nothing will persist after a reload, and the user is warned once.
const memStore={songs:new Map(),playlists:new Map(),lyrics:new Map(),favorites:new Map(),history:new Map(),settings:new Map()};
let memHistoryId=1;
const keyPaths={songs:'id',playlists:'id',lyrics:'key',favorites:'songId',history:'id',settings:'key'};
function warnStorageBroken(){
  if(dbBroken) return; dbBroken=true;
  toast("Your browser's storage is unavailable — songs will play but won't be saved after you close this page. Try leaving private/incognito mode or freeing up disk space.");
}
async function openDBWithRetry(){
  try{ return await openDB(); }
  catch(e){
    console.error('IndexedDB failed to open, retrying once:', e);
    try{ return await new Promise((res,rej)=>setTimeout(()=>openDB().then(res,rej), 400)); }
    catch(e2){ console.error('IndexedDB still unavailable, using in-memory fallback:', e2); warnStorageBroken(); return null; }
  }
}
let dbP=openDBWithRetry();
async function dbPut(store,val){
  const db=await dbP;
  if(!db){ warnStorageBroken(); const k=val[keyPaths[store]]; memStore[store].set(k===undefined?memHistoryId++:k, val); return val; }
  try{ return await new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(val); tx.oncomplete=()=>res(val); tx.onerror=()=>rej(tx.error); }); }
  catch(e){ warnStorageBroken(); const k=val[keyPaths[store]]; memStore[store].set(k===undefined?memHistoryId++:k, val); return val; }
}
async function dbGet(store,key){
  const db=await dbP;
  if(!db) return memStore[store].get(key);
  try{ return await new Promise((res,rej)=>{ const r=db.transaction(store,'readonly').objectStore(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  catch(e){ return memStore[store].get(key); }
}
async function dbGetAll(store){
  const db=await dbP;
  if(!db) return Array.from(memStore[store].values());
  try{ return await new Promise((res,rej)=>{ const r=db.transaction(store,'readonly').objectStore(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
  catch(e){ return Array.from(memStore[store].values()); }
}
async function dbDelete(store,key){
  const db=await dbP;
  if(!db){ memStore[store].delete(key); return; }
  try{ return await new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
  catch(e){ memStore[store].delete(key); }
}
async function dbClearAll(){
  const db=await dbP;
  Object.values(memStore).forEach(m=>m.clear());
  if(!db) return;
  try{ await Promise.all(['songs','playlists','lyrics','favorites','history','settings'].map(s=>new Promise((res,rej)=>{ const tx=db.transaction(s,'readwrite'); tx.objectStore(s).clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);}))); }
  catch(e){}
}
window.addEventListener('unhandledrejection', e=>{
  const msg=String((e.reason&&e.reason.message)||e.reason||'');
  if(/indexeddb|backing store/i.test(msg)){ warnStorageBroken(); e.preventDefault(); }
});


/* ================= ID3 TAG + COVER PARSER ================= */
function decodeID3Text(bytes,enc){
  try{
    if(enc===0) return new TextDecoder('windows-1252').decode(bytes).replace(/\0+$/,'').trim();
    if(enc===3) return new TextDecoder('utf-8').decode(bytes).replace(/\0+$/,'').trim();
    if(enc===1){ let start=0, little=true;
      if(bytes[0]===0xff&&bytes[1]===0xfe){little=true;start=2;} else if(bytes[0]===0xfe&&bytes[1]===0xff){little=false;start=2;}
      return new TextDecoder(little?'utf-16le':'utf-16be').decode(bytes.slice(start)).replace(/\0+$/,'').trim(); }
    if(enc===2) return new TextDecoder('utf-16be').decode(bytes).replace(/\0+$/,'').trim();
  }catch(e){return '';}
  return '';
}
function deunsyncID3(bytes){
  const out=[];
  for(let i=0;i<bytes.length;i++){ out.push(bytes[i]); if(bytes[i]===0xFF&&bytes[i+1]===0x00) i++; }
  return new Uint8Array(out);
}
function parseID3v1(buf){
  try{
    if(buf.byteLength<128) return null;
    const bytes=new Uint8Array(buf, buf.byteLength-128, 128);
    if(!(bytes[0]===0x54&&bytes[1]===0x41&&bytes[2]===0x47)) return null; // "TAG"
    const dec=new TextDecoder('windows-1252');
    const title=dec.decode(bytes.slice(3,33)).replace(/\0+$/,'').trim();
    const artist=dec.decode(bytes.slice(33,63)).replace(/\0+$/,'').trim();
    const album=dec.decode(bytes.slice(63,93)).replace(/\0+$/,'').trim();
    return {title:title||null, artist:artist||null, album:album||null, picture:null};
  }catch(e){ return null; }
}
// Handles ID3v2.2 (3-char frame ids), v2.3/v2.4 (4-char), the global unsynchronisation flag, and
// falls back to a trailing ID3v1 tag. The previous version only understood plain v2.3/v2.4 frames,
// so v2.2 tags and unsynchronised tags silently produced no title/artist at all.
function parseID3(buf){
  try{
    const bytes0=new Uint8Array(buf);
    if(bytes0.length<10||bytes0[0]!==0x49||bytes0[1]!==0x44||bytes0[2]!==0x33) return parseID3v1(buf);
    const ver=bytes0[3]; const flags=bytes0[5];
    const size=((bytes0[6]&0x7f)<<21)|((bytes0[7]&0x7f)<<14)|((bytes0[8]&0x7f)<<7)|(bytes0[9]&0x7f);
    let offset=10;
    if(flags&0x40){
      const dv=new DataView(buf);
      let extSize;
      try{ extSize = ver>=4 ? (((dv.getUint8(offset)&0x7f)<<21)|((dv.getUint8(offset+1)&0x7f)<<14)|((dv.getUint8(offset+2)&0x7f)<<7)|(dv.getUint8(offset+3)&0x7f)) : dv.getUint32(offset); }catch(e){ extSize=0; }
      offset+=extSize;
    }
    let tagBytes=bytes0.slice(offset, Math.min(10+size, bytes0.length));
    if(flags&0x80) tagBytes=deunsyncID3(tagBytes);
    const result={title:null,artist:null,album:null,picture:null};
    const idLen=ver===2?3:4, sizeLen=ver===2?3:4, headerLen=idLen+sizeLen+(ver===2?0:2);
    const titleIds=ver===2?['TT2']:['TIT2'], artistIds=ver===2?['TP1']:['TPE1'], albumIds=ver===2?['TAL']:['TALB'], picIds=ver===2?['PIC']:['APIC'];
    let p=0;
    while(p<tagBytes.length-headerLen){
      let id=''; for(let k=0;k<idLen;k++) id+=String.fromCharCode(tagBytes[p+k]);
      if(!/^[A-Z0-9]+$/.test(id)) break;
      let frameSize;
      if(ver===2) frameSize=(tagBytes[p+3]<<16)|(tagBytes[p+4]<<8)|tagBytes[p+5];
      else if(ver>=4) frameSize=((tagBytes[p+4]&0x7f)<<21)|((tagBytes[p+5]&0x7f)<<14)|((tagBytes[p+6]&0x7f)<<7)|(tagBytes[p+7]&0x7f);
      else frameSize=(tagBytes[p+4]<<24)|(tagBytes[p+5]<<16)|(tagBytes[p+6]<<8)|tagBytes[p+7];
      const frameStart=p+headerLen;
      if(frameSize<=0||frameStart+frameSize>tagBytes.length) break;
      if(titleIds.includes(id)||artistIds.includes(id)||albumIds.includes(id)){
        const encByte=tagBytes[frameStart];
        const text=decodeID3Text(tagBytes.slice(frameStart+1,frameStart+frameSize),encByte);
        if(titleIds.includes(id)&&text) result.title=text;
        if(artistIds.includes(id)&&text) result.artist=text;
        if(albumIds.includes(id)&&text) result.album=text;
      } else if(picIds.includes(id)){
        try{
          let q=frameStart; const encByte=tagBytes[q]; q+=1; let mime='';
          if(ver===2){ mime='image/'+String.fromCharCode(tagBytes[q],tagBytes[q+1],tagBytes[q+2]).toLowerCase(); q+=3; }
          else { while(tagBytes[q]!==0&&q<frameStart+frameSize){ mime+=String.fromCharCode(tagBytes[q]); q++; } q++; }
          q+=1;
          if(encByte===1||encByte===2){ while(!(tagBytes[q]===0&&tagBytes[q+1]===0)&&q<frameStart+frameSize) q+=2; q+=2; }
          else { while(tagBytes[q]!==0&&q<frameStart+frameSize) q++; q++; }
          const imgBytes=tagBytes.slice(q,frameStart+frameSize);
          if(imgBytes.length>50) result.picture=new Blob([imgBytes],{type:mime||'image/jpeg'});
        }catch(e){}
      }
      p=frameStart+frameSize;
    }
    if(!result.title&&!result.artist){ const v1=parseID3v1(buf); if(v1){ result.title=result.title||v1.title; result.artist=result.artist||v1.artist; result.album=result.album||v1.album; } }
    return result;
  }catch(e){ return parseID3v1(buf); }
}
function titleFromFilename(name){
  let n=name.replace(/\.[^.]+$/,'');
  const m=n.match(/^(.+?)\s*-\s*(.+)$/);
  if(m) return {artist:m[1].trim(), title:m[2].trim()};
  return {artist:null, title:n.trim()};
}

/* ================= ADD SONGS (upload) ================= */
async function addAudioFiles(files){
  let added=0;
  const eligible=files.filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|m4a|ogg|flac)$/i.test(f.name));
  if(eligible.length>=1) showUploadProgress(0,eligible.length);
  let done=0;
  for(const file of eligible){
    done++;
    showUploadProgress(done,eligible.length);
    const buf=await file.arrayBuffer();
    const id3=parseID3(buf);
    const fnGuess=titleFromFilename(file.name);
    const title=(id3&&id3.title)||fnGuess.title||'Untitled';
    const artist=(id3&&id3.artist)||fnGuess.artist||'Unknown Artist';
    const album=(id3&&id3.album)||null;
    const blob=new Blob([buf], {type:file.type||'audio/mpeg'});
    const duration=await getAudioDuration(blob);
    const song={ id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2), title, artist, album,
      duration, audioBlob:blob, artBlob:(id3&&id3.picture)||null, addedAt:Date.now(), source:'file' };
    await dbPut('songs', song);
    added++;
  }
  hideUploadProgress();
  if(added){ await refreshLibrary(); notify('Song'+(added>1?'s':'')+' added', `${added} track${added>1?'s':''} added to your library.`); }
  return added;
}
// Chrome/Edge report duration as Infinity for some blob-sourced audio (streamed-media quirk) until you
// seek near the end. decodeAudioData gives the true sample-accurate duration and sidesteps the bug
// entirely; the HTMLAudioElement path is only a fallback for formats decodeAudioData can't handle.
async function getAudioDuration(blob){
  try{
    const buf=await blob.arrayBuffer();
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const audioBuffer=await new Promise((res,rej)=>ctx.decodeAudioData(buf.slice(0), res, rej));
    ctx.close();
    if(isFinite(audioBuffer.duration)&&audioBuffer.duration>0) return audioBuffer.duration;
  }catch(e){}
  return new Promise(resolve=>{
    const a=new Audio(); a.preload='metadata'; const url=URL.createObjectURL(blob);
    const done=(d)=>{ URL.revokeObjectURL(url); resolve(d||0); };
    a.onloadedmetadata=()=>{
      if(isFinite(a.duration)&&a.duration>0){ done(a.duration); return; }
      a.currentTime=1e101;
      a.ontimeupdate=()=>{ a.ontimeupdate=null; const d=isFinite(a.duration)?a.duration:0; done(d); };
    };
    a.onerror=()=>done(0);
    a.src=url;
  });
}

function playQueueOffset(delta){
  if(!library.length) return;
  let ctx = currentPlaylistFilter ? library.filter(s=>currentPlaylistFilter.songIds.includes(s.id)) : library;
  if(!ctx.length) ctx=library;
  const idx=ctx.findIndex(s=>s.id===currentSongId);
  let nextIdx;
  if(shuffleOn) nextIdx=Math.floor(Math.random()*ctx.length);
  else nextIdx=((idx<0?0:idx)+delta+ctx.length)%ctx.length;
  loadSong(ctx[nextIdx].id, true);
}

async function removeSong(id){
  const ok=await modalConfirm({title:'Remove this song?', message:'It will be removed from your library and any playlists.', confirmLabel:'Remove', danger:true});
  if(!ok) return;
  await dbDelete('songs', id); await dbDelete('favorites', id); favorites.delete(id);
  playlists.forEach(p=>p.songIds=p.songIds.filter(x=>x!==id));
  for(const p of playlists) await dbPut('playlists', p);
  if(currentSongId===id){ currentSongId=null; audioEl.pause(); isPlaying=false; setPlayIcon(false); }
  await refreshLibrary(); renderSidebarPlaylists(); renderView(); toast('Song removed');
}

async function createPlaylist(){
  const name=await modalPrompt({title:'New playlist', placeholder:'Playlist name', confirmLabel:'Create'});
  if(!name) return null;
  const pl={id:'p_'+Date.now(), name:name.trim(), songIds:[]}; await dbPut('playlists',pl); playlists.push(pl);
  renderSidebarPlaylists(); updateStats(); renderView(); notify('Playlist created', `"${pl.name}" is ready.`);
  return pl;
}
async function deletePlaylist(id){
  const ok=await modalConfirm({title:'Delete this playlist?', message:'The songs themselves stay in your library.', confirmLabel:'Delete', danger:true});
  if(!ok) return;
  await dbDelete('playlists', id); playlists=playlists.filter(p=>p.id!==id);
  renderSidebarPlaylists(); updateStats(); switchView('playlists');

async function removeFromPlaylist(plId, songId){

}
function openAddToPlaylist(songId){
  const rows=playlists.map(p=>`
    <div class="modal-list-item" data-pl="${p.id}"><div class="pl-dot">♬</div><div style="flex:1;"><div style="font-size:13px; font-weight:600;">${p.name}</div><div style="font-size:11px; color:var(--txt-dim);">${p.songIds.length} song${p.songIds.length!==1?'s':''}</div></div>${p.songIds.includes(songId)?'<span style="color:var(--a3); font-size:12px;">Added</span>':''}</div>`).join('');
  openModal(`
    <div class="modal-title">Add to playlist</div>
    ${playlists.length?`<div style="margin-bottom:10px;">${rows}</div>`:'<div class="modal-msg">You don\'t have any playlists yet.</div>'}
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="modal-btn" id="apl_new">+ New Playlist</button>

  `);
  modalBox.querySelectorAll('.modal-list-item').forEach(el=>{
    el.onclick=async()=>{ await addSongToPlaylist(el.dataset.pl, songId); closeModal(); };
  });
  document.getElementById('apl_close').onclick=closeModal;
  document.getElementById('apl_new').onclick=async()=>{
    const pl=await createPlaylist();
    if(pl){ await addSongToPlaylist(pl.id, songId); } closeModal();
  };
}
async function addSongToPlaylist(plId, songId){
  const pl=playlists.find(p=>p.id===plId); if(!pl) return;
  if(!pl.songIds.includes(songId)){ pl.songIds.push(songId); await dbPut('playlists',pl); renderSidebarPlaylists(); notify('Added to playlist', `Track added to "${pl.name}".`); if(currentView==='playlist-detail') renderView(); }
}
function modalAddSongsToPlaylist(plId){
  const pl=playlists.find(p=>p.id===plId); if(!pl) return;
  const available=library.filter(s=>!pl.songIds.includes(s.id));
  const selected=new Set();
  const rows=available.length ? available.map(s=>`
    <div class="modal-list-item" data-song="${s.id}"><div class="song-thumb" style="width:32px;height:32px;">${songArtHTML(s)}</div><div style="flex:1; min-width:0;"><div style="font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${s.title}</div><div style="font-size:10.5px; color:var(--txt-dim);">${s.artist}</div></div><div class="chk"></div></div>`).join('')
    : '<div class="modal-msg">Every song in your library is already in this playlist.</div>';
  openModal(`
    <div class="modal-title">Add songs to "${pl.name}"</div>
    <div style="max-height:44vh; overflow-y:auto; margin-bottom:14px;">${rows}</div>
    <div class="modal-actions"><button class="modal-btn" id="as_cancel">Cancel</button><button class="modal-btn primary" id="as_add" ${!available.length?'disabled':''}>Add Selected</button></div>
  `);
  modalBox.querySelectorAll('.modal-list-item[data-song]').forEach(el=>{
    el.onclick=()=>{ const id=el.dataset.song; const chk=el.querySelector('.chk');
      if(selected.has(id)){ selected.delete(id); chk.classList.remove('checked'); } else { selected.add(id); chk.classList.add('checked'); } };
  });
  document.getElementById('as_cancel').onclick=closeModal;
  document.getElementById('as_add').onclick=async()=>{
    if(!selected.size){ closeModal(); return; }
    selected.forEach(id=>pl.songIds.push(id));
    await dbPut('playlists',pl); renderSidebarPlaylists(); closeModal(); renderView();
    notify('Songs added', `${selected.size} song${selected.size!==1?'s':''} added to "${pl.name}".`);
  };
}

  const rows=items.length?items.map(h=>{ const s=getSong(h.songId); if(!s) return ''; return `
    <div class="song-row" onclick="loadSong('${s.id}')"><div class="song-thumb">${songArtHTML(s)}</div>
    <div class="song-meta"><b>${s.title}</b><span>${s.artist}</span></div>
    <div class="song-actions"><span style="font-size:11px;">${new Date(h.playedAt).toLocaleDateString()}</span></div></div>`; }).join(''):'<div class="empty-state"><h3>Nothing played yet</h3><p>Your listening history will show up here.</p></div>';
  return `<div class="view-head"><div class="view-title">Recently Played</div></div><div style="overflow-y:auto; flex:1;">${rows}</div>`;
}

const themes={ cosmic:{a1:'#8b6ef2',a2:'#4fa8f5',a3:'#3fe8c9',a4:'#c86dfa',label:'Cosmic Night'},
  dreamy:{a1:'#e2a6f5',a2:'#b79bf7',a3:'#f8c6dd',a4:'#f0abfc',label:'Dreamy Night'},
  midnight:{a1:'#4c47d6',a2:'#6d7bf2',a3:'#9aa4ff',a4:'#5b53c7',label:'Midnight Deep'},
  ocean:{a1:'#1596b0',a2:'#25c4d6',a3:'#7be8f0',a4:'#3aa0c9',label:'Ocean Drift'},
  forest:{a1:'#1e8a5f',a2:'#2fd08a',a3:'#8bf0bd',a4:'#26a374',label:'Forest Calm'},
  romantic:{a1:'#c23361',a2:'#f2557a',a3:'#f7b955',a4:'#e14c86',label:'Romantic Glow'} };
let curTheme='cosmic';
function applyTheme(name, skipSave){
  curTheme=name; const t=themes[name]; const r=document.documentElement.style;
  r.setProperty('--a1',t.a1); r.setProperty('--a2',t.a2); r.setProperty('--a3',t.a3); r.setProperty('--a4',t.a4);
  document.getElementById('atmosSub').textContent=t.label;
  document.querySelectorAll('.atmos-dot').forEach(d=>d.classList.toggle('active', d.dataset.name===name));
  buildHeart(); if(!skipSave) dbPut('settings',{key:'theme',value:name});
}
function buildAtmosRow(target){
  target.innerHTML='';
  Object.keys(themes).forEach(name=>{
    const t=themes[name]; const el=document.createElement('div'); el.className='atmos-dot'+(name===curTheme?' active':'');
    el.dataset.name=name; el.style.background=`linear-gradient(135deg, ${t.a1}, ${t.a2})`;
    el.innerHTML=`<span style="font-size:13px;color:#fff;">✦</span><span class="lbl">${name}</span>`;
    el.onclick=()=>applyTheme(name); target.appendChild(el);
  });
}
buildAtmosRow(document.getElementById('atmosRow'));

function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function resizeCanvas(c){ c.width=c.clientWidth*devicePixelRatio; c.height=c.clientHeight*devicePixelRatio; }
function getAmplitude(){
  if(usingAudioGraph&&analyser&&isPlaying){ analyser.getByteFrequencyData(freqData); let sum=0; for(let i=0;i<freqData.length;i++) sum+=freqData[i]; return (sum/freqData.length)/255; }
  if(isPlaying){ const t=performance.now()/1000; return 0.35+0.28*Math.abs(Math.sin(t*1.7))+0.15*Math.abs(Math.sin(t*3.3)); }
  return 0.06;
}
function getFreqBins(n){
  if(usingAudioGraph&&analyser&&isPlaying){ analyser.getByteFrequencyData(freqData); const step=Math.max(1,Math.floor(freqData.length/n)); const out=[]; for(let i=0;i<n;i++) out.push(freqData[Math.min(freqData.length-1,i*step)]/255); return out; }
  const t=performance.now()/1000; const out=[]; for(let i=0;i<n;i++) out.push(isPlaying?0.22+0.5*Math.abs(Math.sin(t*(1.2+i*0.13)+i)):0.05+0.03*Math.sin(t+i)); return out;
}
const waveCanvas=document.getElementById('waveCanvas');
function drawWave(){
  resizeCanvas(waveCanvas); const ctx=waveCanvas.getContext('2d'); const w=waveCanvas.width,h=waveCanvas.height; ctx.clearRect(0,0,w,h);
  const bins=getFreqBins(90); const song=getSong(currentSongId); const dur=song?song.duration:0;
  const cur=audioEl.currentTime||0; const progress=dur?cur/dur:0; const barW=w/bins.length;
  bins.forEach((v,i)=>{ const bh=Math.max(h*0.06,v*h*0.8); const played=i/bins.length<progress;
    ctx.fillStyle=played?getCSS('--a3'):'rgba(255,255,255,0.18)'; const x=i*barW,bw=barW*0.5;
    ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,h/2-bh/2,bw,bh,3); else ctx.rect(x,h/2-bh/2,bw,bh); ctx.fill(); });
}
const vizCanvas=document.getElementById('vizCanvas');
function drawViz(){
  resizeCanvas(vizCanvas); const ctx=vizCanvas.getContext('2d'); const w=vizCanvas.width,h=vizCanvas.height; ctx.clearRect(0,0,w,h);
  const bins=getFreqBins(40); const barW=w/bins.length;
  bins.forEach((v,i)=>{ const bh=Math.max(h*0.08,v*h*0.9); const grad=ctx.createLinearGradient(0,h/2-bh/2,0,h/2+bh/2);
    grad.addColorStop(0,getCSS('--a4')); grad.addColorStop(1,getCSS('--a2')); ctx.fillStyle=grad; const x=i*barW,bw=barW*0.5;
    ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,h/2-bh/2,bw,bh,3); else ctx.rect(x,h/2-bh/2,bw,bh); ctx.fill(); });
}
const orbCanvas=document.getElementById('orbCanvas');
function drawOrb(){
  resizeCanvas(orbCanvas); const ctx=orbCanvas.getContext('2d'); const w=orbCanvas.width,h=orbCanvas.height; ctx.clearRect(0,0,w,h);
  const amp=getAmplitude(); const cx=w/2,cy=h/2,base=Math.min(w,h)*0.14; const t=performance.now()/1000;
  for(let ring=4; ring>=0; ring--){ const r=base+ring*9*devicePixelRatio+amp*22*devicePixelRatio;
    ctx.beginPath(); ctx.arc(cx,cy,r,t*0.2+ring,t*0.2+ring+5.5);
    ctx.strokeStyle=ring===0?getCSS('--a3'):`rgba(255,255,255,${0.14-ring*0.02})`; ctx.lineWidth=(ring===0?2:1)*devicePixelRatio;
    ctx.globalAlpha=ring===0?0.95:0.55; ctx.stroke(); }
  ctx.globalAlpha=1;
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,base+amp*14*devicePixelRatio);
  grad.addColorStop(0,'#fff'); grad.addColorStop(.35,getCSS('--a2')); grad.addColorStop(.7,getCSS('--a1')); grad.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(cx,cy,base+amp*14*devicePixelRatio,0,7); ctx.fillStyle=grad; ctx.fill();
  ctx.fillStyle='#fff'; ctx.font=`${15*devicePixelRatio}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('♪',cx,cy);
  for(let i=0;i<10;i++){ const ang=t*0.6+i*(6.28/10); const rr=base*1.6+amp*20*devicePixelRatio; const x=cx+Math.cos(ang)*rr, y=cy+Math.sin(ang)*rr*0.9;
    ctx.beginPath(); ctx.arc(x,y,1.6*devicePixelRatio,0,7); ctx.fillStyle='#fff'; ctx.globalAlpha=0.5+0.5*Math.sin(t+i); ctx.fill(); ctx.globalAlpha=1; }
}
function heartPath(cx,cy,s){ return `M${cx} ${cy+0.28*s} C${cx-0.5*s} ${cy-0.35*s} ${cx-1.15*s} ${cy+0.28*s} ${cx} ${cy+1.0*s} C${cx+1.15*s} ${cy+0.28*s} ${cx+0.5*s} ${cy-0.35*s} ${cx} ${cy+0.28*s} Z`; }
function buildHeart(){
  const svg=document.getElementById('heartSvg'); if(!svg) return; svg.innerHTML=''; const ns='http://www.w3.org/2000/svg'; const d=heartPath(100,55,55);
  const defs=document.createElementNS(ns,'defs');
  defs.innerHTML=`<linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${getCSS('--a3')}"/><stop offset="100%" stop-color="${getCSS('--a2')}"/></linearGradient>
  <filter id="hglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  svg.appendChild(defs);
  const fill=document.createElementNS(ns,'path'); fill.setAttribute('d',d); fill.setAttribute('fill','url(#hg)'); fill.setAttribute('opacity','0.05'); svg.appendChild(fill);
  const p=document.createElementNS(ns,'path'); p.setAttribute('d',d); p.setAttribute('fill','none'); p.setAttribute('stroke','url(#hg)'); p.setAttribute('stroke-width','2.4');
  p.setAttribute('stroke-dasharray','1 9'); p.setAttribute('stroke-linecap','round'); p.setAttribute('filter','url(#hglow)'); p.id='heartOutline'; svg.appendChild(p);
  const pts=[[100,20],[57,45],[143,45],[100,120],[70,75],[130,75],[100,60]];
  pts.forEach((pt,i)=>{ const c=document.createElementNS(ns,'circle'); c.setAttribute('cx',pt[0]); c.setAttribute('cy',pt[1]); c.setAttribute('r',i===3?2.6:1.6);
    c.setAttribute('fill','#fff'); c.setAttribute('filter','url(#hglow)'); c.classList.add('hstar'); c.dataset.ph=i; svg.appendChild(c); });
}
function animateHeart(){
  const t=performance.now()/1000; const amp=getAmplitude();
  document.querySelectorAll('.hstar').forEach(c=>{ const ph=+c.dataset.ph; c.setAttribute('opacity', Math.min(1,0.5+0.5*Math.sin(t*2+ph)+amp*0.3)); });
  const o=document.getElementById('heartOutline'); if(o) o.setAttribute('stroke-width',(2.2+amp*2.2).toFixed(2));
}
function buildDeco(){
  const decoSvg=document.getElementById('decoSvg'); if(!decoSvg) return; decoSvg.innerHTML=''; const ns='http://www.w3.org/2000/svg';
  const defs=document.createElementNS(ns,'defs'); defs.innerHTML=`<filter id="dglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`; decoSvg.appendChild(defs);
  const path=document.createElementNS(ns,'path'); path.setAttribute('d','M40 210 C140 150 210 230 280 150 C330 95 380 120 470 40'); path.setAttribute('fill','none');
  path.setAttribute('stroke',getCSS('--a1')); path.setAttribute('stroke-width','1'); path.setAttribute('stroke-dasharray','2 7'); path.setAttribute('opacity','0.5'); path.setAttribute('filter','url(#dglow)'); decoSvg.appendChild(path);

  // blue, topaz, golden, golden-red — cycled across every heart/star so the field reads as multicolor, not monochrome
  // blue, topaz, golden, golden-red — two shades of each so the field reads as richly varied, not just 4 flat hues
  const PALETTE=['#5b8cff','#8fb2ff','#e0954a','#f2b06c','#ffd76a','#ffe8a0','#e8563a','#ff7a52'];
  const ANIMS=['spiral','butterfly','orbit','drift','wave'];
  const N=42;
  const items=[];
  const GA=137.508*Math.PI/180; // golden angle — gives an even, non-repeating scatter without manual placement
  for(let i=0;i<N;i++){
    const r=Math.sqrt((i+1)/N);
    const ang=i*GA;
    items.push({
      x: 260 + Math.cos(ang)*r*230,
      y: 130 + Math.sin(ang)*r*105,
      type: i%2===0?'heart':'star',
      s: 6+((i*37)%9),
      color: PALETTE[i%PALETTE.length],
      anim: ANIMS[i%ANIMS.length],
      speed: 0.5+((i*13)%7)/6
    });
  }
  items.forEach((it,i)=>{
    const g=document.createElementNS(ns,'g');
    g.setAttribute('transform',`translate(${it.x.toFixed(1)},${it.y.toFixed(1)})`);
    g.classList.add('dstar');
    g.dataset.ph=i; g.dataset.anim=it.anim; g.dataset.speed=it.speed;
    const inner=document.createElementNS(ns,'g'); inner.classList.add('dstar-inner');
    let el;
    if(it.type==='star'){ el=document.createElementNS(ns,'path'); const s=it.s;
      el.setAttribute('d',`M0 ${-s} L${s*0.28} ${-s*0.28} L${s} 0 L${s*0.28} ${s*0.28} L0 ${s} L${-s*0.28} ${s*0.28} L${-s} 0 L${-s*0.28} ${-s*0.28} Z`);
      el.setAttribute('fill',it.color);
    } else { el=document.createElementNS(ns,'path'); const s=it.s*0.09;
      el.setAttribute('d',`M0 ${4*s} C${-6*s} ${-3*s} ${-14*s} ${4*s} 0 ${12*s} C${14*s} ${4*s} ${6*s} ${-3*s} 0 ${4*s} Z`);
      el.setAttribute('fill',it.color);
    }
    el.setAttribute('filter','url(#dglow)');
    inner.appendChild(el); g.appendChild(inner); decoSvg.appendChild(g);
  });
}
// Each item picks one of four motion styles so the field never looks like one repeated animation:
// spiral (DNA-like — orbiting radius + self-rotation), butterfly (side-to-side flutter with wing-tilt),
// orbit (simple circular drift), drift (gentle vertical bob — the original pulsing motion).
function animateDeco(){
  const t=performance.now()/1000;
  document.querySelectorAll('.dstar').forEach(g=>{
    const ph=+g.dataset.ph, anim=g.dataset.anim, spd=+g.dataset.speed||1;
    const inner=g.querySelector('.dstar-inner'); if(!inner) return;
    const tt=t*spd+ph;
    let dx=0,dy=0,rot=0,scale=1,op=0.6;
    if(anim==='spiral'){
      const r=5+4*Math.sin(tt*0.6);
      dx=r*Math.cos(tt*2.2); dy=r*Math.sin(tt*2.2)*0.6;
      rot=tt*50;
      op=0.4+0.5*Math.abs(Math.sin(tt));
    } else if(anim==='butterfly'){
      dx=9*Math.sin(tt*1.8);
      dy=4*Math.sin(tt*3.6)-3;
      rot=18*Math.sin(tt*3.6);
      scale=0.9+0.15*Math.abs(Math.sin(tt*3.6));
      op=0.45+0.45*Math.abs(Math.sin(tt*1.2));
    } else if(anim==='orbit'){
      dx=7*Math.cos(tt); dy=7*Math.sin(tt);
      op=0.4+0.5*Math.abs(Math.sin(tt*0.8));
    } else if(anim==='wave'){
      dx=10*Math.sin(tt*1.1);
      dy=6*Math.sin(tt*2.2+ph);
      rot=10*Math.sin(tt*1.1);
      op=0.4+0.5*Math.abs(Math.sin(tt*1.6));
    } else {
      dy=4*Math.sin(tt);
      op=0.35+0.5*Math.abs(Math.sin(tt*1.4));
    }
    inner.setAttribute('transform',`translate(${dx.toFixed(2)},${dy.toFixed(2)}) rotate(${rot.toFixed(1)}) scale(${scale.toFixed(2)})`);
    g.setAttribute('opacity',op.toFixed(2));
  });
}

const pCanvas=document.getElementById('particleCanvas');
/* Artwork-local... crystal layer replaces the older full-screen particle stream. */
if(pCanvas) pCanvas.style.display='none';
let crystalParticles=[];
let crystalFieldSongId=null;
const crystalHeartSVG=`<svg viewBox="0 0 100 100" aria-hidden="true"><path class="crystal-edge" fill="url(#crystalGem)" d="M50 86 C43 78 14 60 14 37 C14 20 34 12 50 29 C66 12 86 20 86 37 C86 60 57 78 50 86Z"/><path class="crystal-facet" d="M50 29 L35 21 L14 37 L31 42Z"/><path class="crystal-facet" d="M50 29 L65 21 L86 37 L69 42Z"/><path class="crystal-facet-dark" d="M31 42 L50 29 L50 86 L22 58Z"/><path class="crystal-facet" d="M69 42 L50 29 L50 86 L78 58Z"/><path class="crystal-shine" d="M29 29 C33 22 42 22 45 29 C40 27 35 29 31 35Z" fill="rgba(255,255,255,.72)"/></svg>`;
const crystalStarSVG=`<svg viewBox="0 0 100 100" aria-hidden="true"><path class="crystal-edge" fill="url(#crystalGem)" d="M50 4 L61 39 L96 50 L61 61 L50 96 L39 61 L4 50 L39 39Z"/><path class="crystal-facet" d="M50 4 L61 39 L50 50 L39 39Z"/><path class="crystal-facet" d="M96 50 L61 61 L50 50 L61 39Z"/><path class="crystal-facet-dark" d="M50 96 L39 61 L50 50 L61 61Z"/><path class="crystal-shine" d="M49 13 L54 40 L47 45 L42 31Z" fill="rgba(255,255,255,.72)"/></svg>`;
function crystalMarkup(type,colorKey,uid){
  const THEMES={
    blue:  {a:'#e5f8ff', b:'#54bce9', c:'#183e82', d:'#07142e'},
    topaz: {a:'#ffe9c9', b:'#e0954a', c:'#7a4212', d:'#2a1404'},
    golden:{a:'#fff6d2', b:'#ffd76a', c:'#9a7418', d:'#332405'},
    goldred:{a:'#ffe0c8', b:'#e8563a', c:'#7a2414', d:'#280a04'}
  };
  const th=THEMES[colorKey]||THEMES.blue;
  const id='cr'+colorKey+uid;
  return `<defs><linearGradient id="${id}" x1="18%" y1="10%" x2="82%" y2="92%"><stop offset="0" stop-color="${th.a}" stop-opacity=".96"/><stop offset=".2" stop-color="${th.b}"/><stop offset=".58" stop-color="${th.c}"/><stop offset="1" stop-color="${th.d}"/></linearGradient></defs>`+(type==='heart'?crystalHeartSVG:crystalStarSVG).replaceAll('url(#crystalGem)',`url(#${id})`);
}
function crystalRand(a,b){return a+Math.random()*(b-a);}
function buildCrystalField(){
  const field=document.getElementById('crystalField'); if(!field) return;
  field.innerHTML=''; crystalParticles=[]; crystalFieldSongId=currentSongId;
  const COLORS=['blue','topaz','golden','goldred'];
  const ANIMS=['drift','spiral','butterfly','pulse'];
  const N=34;
  for(let i=0;i<N;i++){
    const type=i%3===0?'heart':'star';
    const colorKey=COLORS[i%COLORS.length];
    const anim=ANIMS[(i*3)%ANIMS.length];
    const el=document.createElement('div'); el.className=`crystal-particle ${type==='heart'?'gem-heart':'gem-star'}`; el.innerHTML=crystalMarkup(type,colorKey,i);
    const side=i%4; let bx,by;
    if(side===0){bx=crystalRand(.00,.28);by=crystalRand(.02,.98);} else if(side===1){bx=crystalRand(.72,1);by=crystalRand(.02,.98);} else if(side===2){bx=crystalRand(.08,.92);by=crystalRand(.00,.24);} else {bx=crystalRand(.08,.92);by=crystalRand(.76,1);}
    const base=type==='heart'?34:25, size=crystalRand(.72,1.12); el.style.left=(bx*100)+'%'; el.style.top=(by*100)+'%'; el.style.width=(base*size)+'px'; el.style.height=(base*size)+'px'; field.appendChild(el);
    crystalParticles.push({el,bx,by,x:bx,y:by,vx:0,vy:0,anim,phase:crystalRand(0,Math.PI*2),speed:crystalRand(.55,1.05),ampX:crystalRand(.018,.055),ampY:crystalRand(.025,.075),rot:crystalRand(-14,14),rotAmp:crystalRand(3,9),scale:crystalRand(.84,1.04)});
  }
  setCrystalPlaying(isPlaying);
}
function setCrystalPlaying(playing){
  const field=document.getElementById('crystalField'); if(field) field.classList.toggle('playing',!!playing);
  crystalParticles.forEach(p=>p.el.classList.toggle('playing',!!playing));
}
// Four distinct motion styles per particle (assigned in buildCrystalField) so the field never looks
// like one repeated wobble: drift (original gentle physics-spring bob), spiral (orbiting radius +
// extra rotation), butterfly (wide asymmetric side-to-side flutter), pulse (mostly scale-breathing,
// minimal drift).
function updateCrystalField(dt){
  const field=document.getElementById('crystalField'); if(!field){crystalParticles=[];return;}
  if(crystalFieldSongId!==currentSongId) buildCrystalField();
  const amp=getAmplitude(), t=performance.now()/1000, rect=field.getBoundingClientRect();
  crystalParticles.forEach(p=>{
    const energy=isPlaying?(0.55+amp*1.55):0.16;
    let targetX,targetY,extraRot=0,pulseAmp=.10;
    if(p.anim==='spiral'){
      const radius=p.ampX*(0.6+0.4*Math.sin(t*0.3+p.phase))*1.4;
      const ang=t*p.speed*1.6+p.phase;
      targetX=p.bx+Math.cos(ang)*radius*energy; targetY=p.by+Math.sin(ang)*radius*0.75*energy;
      extraRot=t*p.speed*40;
    } else if(p.anim==='butterfly'){
      targetX=p.bx+Math.sin(t*p.speed*2.2+p.phase)*p.ampX*1.8*energy;
      targetY=p.by+Math.sin(t*p.speed*4.4+p.phase)*p.ampY*0.45*energy-(isPlaying?amp*.008:0);
      extraRot=Math.sin(t*p.speed*4.4+p.phase)*p.rotAmp*1.6;
    } else if(p.anim==='pulse'){
      targetX=p.bx+Math.sin(t*p.speed*.6+p.phase)*p.ampX*.35*energy;
      targetY=p.by+Math.cos(t*p.speed*.6+p.phase)*p.ampY*.35*energy;
      pulseAmp=.22;
    } else {
      targetX=p.bx+Math.sin(t*p.speed+p.phase)*p.ampX*energy+Math.sin(t*.37+p.phase)*.012;
      targetY=p.by+Math.cos(t*p.speed*.86+p.phase)*p.ampY*energy-(isPlaying?amp*.012:0);
    }
    const stiffness=isPlaying?.95:.55, damping=isPlaying?.78:.86;
    p.vx+=(targetX-p.x)*stiffness*dt; p.vy+=(targetY-p.y)*stiffness*dt;
    p.vx*=Math.pow(damping,dt*60); p.vy*=Math.pow(damping,dt*60); p.x+=p.vx*dt; p.y+=p.vy*dt;
    const pulse=isPlaying?1+amp*pulseAmp*Math.sin(t*2.2+p.phase):1;
    const rot=p.rot+Math.sin(t*p.speed*.7+p.phase)*p.rotAmp*(isPlaying?.9:.35)+extraRot;
    const alpha=isPlaying?.55+.37*(.5+.5*Math.sin(t*p.speed+p.phase)):0;
    const dx=(p.x-p.bx)*rect.width, dy=(p.y-p.by)*rect.height;
    p.el.style.transform=`translate3d(${dx.toFixed(2)}px,${dy.toFixed(2)}px,0) rotate(${rot.toFixed(2)}deg) scale(${(p.scale*pulse).toFixed(3)})`; p.el.style.opacity=alpha.toFixed(3);
  });
}
let last=performance.now();
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; drawWave(); drawViz(); drawOrb(); animateHeart(); animateDeco(); updateCrystalField(dt); document.querySelectorAll('.fav-mini,.ic-mini').forEach(()=>{}); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

/* ================= INIT ================= */
buildHeart();
loadAll();
setInterval(updateStats, 15000);
</script>
